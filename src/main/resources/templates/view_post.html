<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">ExcelR Blog App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Modern Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f9fafb;
            --bg-card: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --border: #e5e7eb;
            --shadow-sm: 0 4px 20px -2px rgba(99, 102, 241, 0.08);
            --shadow-md: 0 10px 30px -6px rgba(99, 102, 241, 0.12);
            --radius: 1.25rem;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow-sm: 0 4px 20px -2px rgba(0,0,0,0.4);
            --shadow-md: 0 10px 30px -6px rgba(0,0,0,0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(to bottom, #f9fafb, #f3f4f6);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.88);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand,
        .navbar-nav .nav-link {
            color: var(--text) !important;
            font-weight: 600;
            transition: color 0.25s ease;
        }

        .navbar-nav .nav-link:hover {
            color: var(--primary) !important;
        }

        .main-container {
            padding-top: 6rem;
            padding-bottom: 6rem;
        }

        .post-title {
            font-size: clamp(2.5rem, 6vw, 3.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.12;
            margin-bottom: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .post-content {
            font-size: 1.125rem;
            color: var(--text-muted);
        }

        .post-content p {
            margin-bottom: 1.6rem;
        }

        /* Comments */
        .comment {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .comment:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .comment strong {
            color: var(--primary);
            font-weight: 700;
        }

        /* Comment Form */
        .comment-form {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2rem;
            margin-top: 2.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .comment-form label {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            display: block;
        }

        .comment-form input,
        .comment-form textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.85rem 1.1rem;
            background: var(--bg);
            color: var(--text);
            transition: all 0.25s ease;
        }

        .comment-form input:focus,
        .comment-form textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
            outline: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            padding: 0.85rem 2rem;
            font-weight: 600;
            border-radius: 0.875rem;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(99,102,241,0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99,102,241,0.35);
        }

        /* Search Sidebar */
        .search-sidebar {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            position: sticky;
            top: 90px;
        }

        /* Footer */
        .footer {
            background: var(--text);
            color: #9ca3af;
            padding: 3.5rem 0;
            margin-top: 6rem;
            border-top: 1px solid var(--border);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
            color: #a5b4fc;
        }

        @media (max-width: 991px) {
            .main-container { padding-top: 5rem; }
        }

        @media (max-width: 767px) {
            .post-title { font-size: 2.6rem; }
            .main-container { padding-top: 4.5rem; padding-bottom: 4rem; }
            .comment-form { padding: 1.5rem; }
            .search-sidebar { position: static; margin-top: 2rem; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">ExcelR Blog</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ml-auto">
                <a class="nav-link" th:href="@{/dashboard}">Home</a>
                <a class="nav-link" th:href="@{/register}">Register</a>
                <a class="nav-link" th:href="@{/login}">Login</a>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container main-container">
    <div class="row">
        <!-- Post + Comments -->
        <div class="col-lg-8">
            <article>
                <h1 class="post-title" th:text="${post.title}">Post Title</h1>
                <div class="post-content mb-5" th:utext="${post.content}">
                    Post content goes here...
                </div>

                <hr class="my-5">

                <h3 class="mb-4">Comments</h3>

                <div th:each="comment : ${comments}" class="comment">
                    <strong th:text="${comment.name}">User</strong>
                    <span class="text-muted small"> • </span>
                    <p class="mb-0 mt-2" th:text="${comment.content}">Comment content</p>
                </div>

                <!-- Add Comment Form -->
                <div th:if="${user != null and user.id != post.user.id}">
                    <div class="comment-form">
                        <h4 class="mb-4">Add your comment</h4>
                        <form th:action="@{/comment/{postId}(postId=${post.id})}" th:object="${commentObj}" method="post">
                            <div class="form-group">
                                <label>Name</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            <div class="form-group">
                                <label>Comment</label>
                                <textarea class="form-control" rows="4" th:field="*{content}" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit Comment</button>
                        </form>
                    </div>
                </div>

                <div th:if="${user != null and user.id == post.user.id}" class="mt-4 text-muted">
                    You cannot comment on your own post.
                </div>
            </article>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <div class="search-sidebar">
                <h5 class="mb-3">Search Blog</h5>
                <form th:action="@{/search}" method="get">
                    <div class="input-group">
                        <input type="text" name="query" class="form-control"
                               placeholder="Search articles..." th:value="${query}">
                        <div class="input-group-append">
                            <button type="submit" class="btn btn-primary">Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container text-center">
        <p>© 2023 — <a href="#">ExcelR</a>. All rights reserved.</p>
    </div>
</footer>

<!-- Optional: Bootstrap JS (if you need dropdowns/collapse) -->
<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script> -->

</body>
</html>
