<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ExcelR Blog • Latest Insights</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --border: #e5e7eb;
            --shadow-sm: 0 6px 24px -4px rgba(99, 102, 241, 0.1);
            --shadow-md: 0 16px 48px -12px rgba(99, 102, 241, 0.18);
            --radius-lg: 1.5rem;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow-sm: 0 6px 24px -4px rgba(0,0,0,0.5);
            --shadow-md: 0 16px 48px -12px rgba(0,0,0,0.7);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(to bottom, #f9fafb, #f3f4f6);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Navbar - Glassmorphic */
        .navbar {
            background: rgba(255, 255, 255, 0.82) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
        }

        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.85) !important;
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.9rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.8px;
        }

        .nav-link {
            color: var(--text) !important;
            font-weight: 600;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2.5px;
            bottom: -6px;
            left: 0;
            background: var(--primary-gradient);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link:hover::after { width: 100%; }
        .nav-link:hover { color: var(--primary) !important; }

        .main-container {
            padding-top: 7rem;
            padding-bottom: 6rem;
        }

        /* Cards */
        .post-card {
            background: var(--card-bg);
            border: none;
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .post-card:hover {
            transform: translateY(-14px);
            box-shadow: var(--shadow-md);
        }

        .card-content {
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        .post-title {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 0.9rem;
            line-height: 1.28;
        }

        .post-title a {
            color: var(--text);
            text-decoration: none;
            background: linear-gradient(to right, var(--primary), var(--primary)) no-repeat right bottom / 0% 3px;
            transition: background-size 0.45s ease;
        }

        .post-title a:hover {
            background-size: 100% 3px;
        }

        .post-date {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.1rem;
        }

        .post-excerpt {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.98rem;
            transition: all 0.35s ease;
        }

        .read-more:hover {
            color: var(--primary-dark);
            gap: 1rem;
        }

        /* Search */
        .search-glass {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.8rem;
            box-shadow: var(--shadow-sm);
        }

        .search-glass input {
            border-radius: 3rem;
            padding: 0.9rem 1.5rem;
            border: 1px solid var(--border);
            font-size: 1.05rem;
        }

        .search-glass .btn-primary {
            border-radius: 3rem;
            padding: 0.9rem 1.8rem;
            background: var(--primary-gradient);
            border: none;
            font-weight: 600;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 7rem 2rem;
            background: rgba(99,102,241,0.03);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border);
        }

        .empty-emoji {
            font-size: 6rem;
            margin-bottom: 1.8rem;
            opacity: 0.75;
        }

        /* Footer */
        footer {
            background: var(--text);
            color: #9ca3af;
            padding: 4.5rem 0 3rem;
            margin-top: 7rem;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 992px) {
            .main-container { padding-top: 6rem; }
            .post-title { font-size: 1.5rem; }
        }

        @media (max-width: 576px) {
            .card-content { padding: 1.6rem; }
            .search-glass { padding: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">ExcelR Blog</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/dashboard}">Home</a>
                <a class="nav-link" th:href="@{/register}">Register</a>
                <a class="nav-link" th:href="@{/login}">Login</a>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container main-container">
    <div class="row g-5">
        <!-- Posts -->
        <div class="col-lg-8">
            <div th:each="post : ${posts}">
                <div class="post-card mb-5">
                    <div class="card-content">
                        <div class="post-date" th:text="${#temporals.format(post.createdOn, 'dd MMM yyyy')}"></div>
                        <h5 class="post-title">
                            <a th:href="@{'/view/' + ${post.id}}" th:text="${post.title}">Amazing Post Title</a>
                        </h5>
                        <p class="post-excerpt">
                            <span th:utext="${#strings.abbreviate(post.content, 180)}">...</span>
                        </p>
                        <a th:href="@{'/view/' + ${post.id}}" class="read-more">
                            Continue reading →
                        </a>
                    </div>
                </div>
            </div>

            <!-- Modern Empty State -->
            <div th:if="${#lists.isEmpty(posts)}" class="empty-state mx-auto my-5">
                <div class="empty-emoji">📪</div>
                <h3 class="mb-3 fw-bold">Nothing here yet...</h3>
                <p class="text-muted mb-4 fs-5" style="max-width: 480px; margin: 0 auto;">
                    Looks like there are no posts at the moment<br>
                    or nothing matches your search.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a href="/dashboard" class="btn btn-outline-primary px-5 py-3">Browse All Posts</a>
                    <a href="/" class="btn btn-primary px-5 py-3">Back to Home</a>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <div class="search-glass sticky-top" style="top: 110px;">
                <h5 class="mb-4 fw-semibold">Search the Blog</h5>
                <form th:action="@{/search}" method="get" class="position-relative">
                    <input type="text" name="query" class="form-control form-control-lg"
                           placeholder="Search articles..." th:value="${query}">
                    <button type="submit" class="btn btn-primary position-absolute top-50 end-0 translate-middle-y me-3">
                        Search
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0">© 2023–2026 ExcelR Blog • Crafted with passion</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
